# mount.default_mount_point is where the target deployment partition (and,
# under it, the ESP + any extra_mounts) gets mounted when the request's own
# mount_point is left empty.
[mount]
default_mount_point = "/mnt/upac-setup"

# mkfs.ext4_bin/xfs_bin are the mkfs binaries shelled out to for ext4/xfs
# formatting (btrfs is done natively via btrfs-mkfs, ESP natively via fatfs).
# mkfs.wipefs_bin clears a partition's existing filesystem
# signature before formatting, only when the request explicitly opts into it
# (CSetupWholeDiskRequest.gpt.force_wipe) — never run silently.
[mkfs]
ext4_bin = "mkfs.ext4"
xfs_bin = "mkfs.xfs"
wipefs_bin = "wipefs"

# partition.settle_attempts/settle_interval_ms bound how long DiskLayout::create waits for the
# kernel (via udev) to create the new partition device nodes after BLKRRPART, before giving up —
# the ioctl itself is synchronous, but the /dev/vdaN nodes it triggers are created by udev
# asynchronously afterward. esp_label/deploy_label name both the GPT partition entry itself
# (DiskLayout::create) and the filesystem volume label written at format time
# (TargetSysroot::create_whole_disk) — purely informational (`lsblk -f`/`blkid`/other OS
# installers), nothing in this codebase looks a partition up by either. Uppercase by the same
# convention real-world ESP volume labels always use.
[partition]
settle_attempts = 50
settle_interval_ms = 100
esp_label = "ESP"
deploy_label = "UPAC-DEPLOY"

# genesis.scratch_filename is where the freshly-built package database is
# written (under the OS temp dir) before being embedded into the new /usr
# tree — purely transient, read back once right after the write.
#
# esp_fallback_loader is the fixed "removable media" path UEFI firmware always tries when NVRAM
# has no Boot#### entries at all, which is exactly genesis's situation on a brand-new disk. The
# resolved boot plugin's own `esp_loader_source()` (see `booters/booter.toml`) says which source
# path — if any — a fresh ESP needs it copied from; genesis only owns the destination.
# efi_linux_dir is a real, mounted-filesystem-relative path (forward slashes, joined via
# `Path::join`) to where `composefs-boot`'s own UKI writer always lands `upac-to.efi`/
# `upac-from.efi` (`EFI/Linux/`, hardcoded upstream) — used only to seed `upac-from.efi` with the
# same first image on genesis's very first deploy. Distinct from `booters/booter.toml`'s
# `uki.efi_linux_dir`, which is the same directory spelled as a backslash UEFI device-path string
# for NVRAM Boot#### entries, not a filesystem path — the two can't share a definition across the
# crate boundary.
[genesis]
scratch_filename = "genesis-packages.redb"
esp_fallback_loader = "EFI/BOOT/BOOTX64.EFI"
efi_linux_dir = "EFI/Linux"
